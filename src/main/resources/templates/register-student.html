<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration - CareerForge AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="py-5">
    <div class="container max-w-600">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Student Account Registration</h2>
            <p class="text-secondary">Join CareerForge AI to measure &amp; boost your placement readiness</p>
        </div>

        <div class="card-saas p-4 p-md-5">
            <form th:action="@{/register/student}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="name" class="form-control" required placeholder="Aarav Sharma">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" required placeholder="aarav@college.edu">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" placeholder="9876543210">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Academic Branch</label>
                        <select name="branch" class="form-select" required>
                            <option value="Computer Science & Engg">Computer Science &amp; Engg</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="AI & Data Science">AI &amp; Data Science</option>
                            <option value="Electronics & Comm">Electronics &amp; Comm</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Year</label>
                        <select name="year" class="form-select" required>
                            <option value="4th Year">4th Year</option>
                            <option value="3rd Year">3rd Year</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">CGPA</label>
                        <input type="number" step="0.01" name="cgpa" class="form-control" placeholder="8.50">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mt-4 btn-lg">Create Student Account</button>
            </form>
            <div class="text-center mt-3 small">
                Already registered? <a href="/login" class="text-primary fw-semibold">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
