<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CareerForge AI Ecosystem</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="d-flex align-items-center min-vh-100 py-5">

    <div class="container max-w-500">
        <div class="text-center mb-4">
            <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                <i class="fas fa-brain text-primary fa-2x"></i>
                <span class="brand-title display-6">CareerForge AI</span>
            </a>
            <p class="text-secondary mt-2">Sign in to access your intelligent career portal</p>
        </div>

        <!-- 1-Click Quick Demo Login Banner for Faculty Viva -->
        <div class="card-saas p-3 mb-4 bg-primary-subtle border-primary text-center">
            <h6 class="fw-bold text-primary mb-2"><i class="fas fa-bolt me-1"></i> Quick 1-Click Faculty Demo Login</h6>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <a href="/demo-login/student" class="btn btn-sm btn-primary">
                    <i class="fas fa-user-graduate me-1"></i> Demo Student
                </a>
                <a href="/demo-login/recruiter" class="btn btn-sm btn-success">
                    <i class="fas fa-building me-1"></i> Demo Recruiter
                </a>
                <a href="/demo-login/admin" class="btn btn-sm btn-dark">
                    <i class="fas fa-user-shield me-1"></i> Demo Admin
                </a>
            </div>
        </div>

        <div class="card-saas p-4 p-md-5">
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
            <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="student@careerforge.ai" required>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-semibold mb-0">Password</label>
                        <a href="#" class="small text-primary text-decoration-none" onclick="alert('Password recovery: Contact system administrator or re-register.');">Forgot Password?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 btn-lg mb-3">Sign In to Dashboard</button>
            </form>

            <hr class="my-4">

            <div class="text-center text-secondary small">
                Don't have an account? <br>
                <a href="/register/student" class="fw-semibold text-primary">Register as Student</a> | 
                <a href="/register/recruiter" class="fw-semibold text-success">Register as Recruiter</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
