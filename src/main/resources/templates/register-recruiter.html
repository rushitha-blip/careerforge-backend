<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recruiter Registration - CareerForge AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="py-5">
    <div class="container max-w-600">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Recruiter Portal Registration</h2>
            <p class="text-secondary">Discover placement-ready campus talent</p>
        </div>

        <div class="card-saas p-4 p-md-5">
            <form th:action="@{/register/recruiter}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Company Name</label>
                        <input type="text" name="companyName" class="form-control" required placeholder="TechCorp Global">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Recruiter Name</label>
                        <input type="text" name="name" class="form-control" required placeholder="Neha Gupta">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Work Email</label>
                        <input type="email" name="email" class="form-control" required placeholder="neha@techcorp.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Industry</label>
                        <input type="text" name="industry" class="form-control" placeholder="IT & Software Services">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Office Location</label>
                        <input type="text" name="location" class="form-control" placeholder="Bangalore, India">
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 mt-4 btn-lg">Create Recruiter Account</button>
            </form>
            <div class="text-center mt-3 small">
                Already registered? <a href="/login" class="text-primary fw-semibold">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
