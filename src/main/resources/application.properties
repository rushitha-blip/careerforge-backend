spring.application.name=CareerForge AI

# Port Configuration
server.port=8085

# H2 Database Configuration (Default for zero-setup execution)
spring.datasource.url=jdbc:h2:mem:careerforgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# MySQL Configuration (To use MySQL, comment H2 properties above and uncomment below)
# spring.datasource.url=jdbc:mysql://localhost:3306/careerforge_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console Configuration for Debugging & Viva Evaluation
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf Cache (Disabled for immediate UI updates)
spring.thymeleaf.cache=false

# Multipart File Upload Limits (for Resume / Certificates)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
